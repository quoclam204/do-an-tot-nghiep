services:
  db:
    image: postgres:15-alpine
    container_name: dalat_agri_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: dalat_agri
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dalat_agri"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - dalatagri-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dalat_agri_backend
    restart: always
    environment:
      DATABASE_URL: "postgresql://postgres:password123@db:5432/dalat_agri?schema=public"
      JWT_SECRET: "dalat_agri_super_secure_jwt_secret_key_2026"
      JWT_EXPIRES_IN: "7d"
      JWT_REFRESH_SECRET: "dalat_agri_refresh_token_secret_key_2026"
      JWT_REFRESH_EXPIRES_IN: "30d"
      ADMIN_DEFAULT_EMAIL: "nguyenlequoclam@gmail.com"
      ADMIN_DEFAULT_PASSWORD: "Admin@123456"
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dalatagri-network

networks:
  dalatagri-network:
    driver: bridge

volumes:
  pgdata:
