<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16a34a" />
      <stop offset="50%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#14532d" />
    </linearGradient>
    <linearGradient id="leafGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#bbf7d0" />
    </linearGradient>
    <linearGradient id="leafGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#86efac" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#052e16" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background with smooth rounded corners -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Subtle organic background rings -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#22c55e" stroke-width="2" opacity="0.25" />
  <circle cx="256" cy="256" r="160" fill="none" stroke="#86efac" stroke-width="1.5" opacity="0.2" />

  <!-- Main Agriculture / Sprout Symbol -->
  <g filter="url(#glow)">
    <!-- Main stem -->
    <path d="M256 390 C256 290 256 210 256 150" stroke="#ffffff" stroke-width="18" stroke-linecap="round" fill="none" />

    <!-- Left Sprout Leaf -->
    <path d="M256 280 C210 280 145 255 130 190 C175 185 235 220 256 280 Z" fill="url(#leafGrad1)" />

    <!-- Right Sprout Leaf (Sunlit / Golden tint) -->
    <path d="M256 240 C302 240 367 215 382 150 C337 145 277 180 256 240 Z" fill="url(#leafGrad2)" opacity="0.95" />

    <!-- Top Sprout Center -->
    <path d="M256 165 C235 125 250 90 256 75 C262 90 277 125 256 165 Z" fill="#ffffff" />

    <!-- Sun rays behind sprout -->
    <circle cx="340" cy="130" r="14" fill="#fef08a" opacity="0.85" />
    <circle cx="340" cy="130" r="24" fill="none" stroke="#fef08a" stroke-width="3" opacity="0.4" />
    
    <!-- Base soil / fertile ground mound -->
    <path d="M170 395 C215 380 297 380 342 395 C315 410 200 410 170 395 Z" fill="#bbf7d0" opacity="0.9" />
  </g>

  <!-- Clean modern text banner at bottom -->
  <text x="256" y="458" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="3">DALATAGRI</text>
</svg>
