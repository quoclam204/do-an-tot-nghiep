  <ellipse cx="940" cy="581" rx="100" ry="21" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
  <text x="940" y="585" text-anchor="middle" font-size="11.5" fill="#000000">Giám sát &amp; Nhật ký bảo mật</text>


