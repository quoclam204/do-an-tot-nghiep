  <ellipse cx="555" cy="76" rx="85" ry="21" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="555" y="75" text-anchor="middle" font-size="10.5" fill="#000000">Xác thực Turnstile</text>
  <text x="555" y="88" text-anchor="middle" font-size="9.5" fill="#444444">(Anti-Bot Captcha)</text>

  <path d="M 400 76 L 470 76" stroke="#000000" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow-open)"/>
  <text x="435" y="70" text-anchor="middle" font-size="9" fill="#000000">&lt;&lt;include&gt;&gt;</text>

  <ellipse cx="315" cy="141" rx="85" ry="21" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
  <text x="315" y="145" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#000000">Đăng nhập hệ thống</text>

  <ellipse cx="555" cy="141" rx="85" ry="21" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
