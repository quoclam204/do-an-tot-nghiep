  <text x="555" y="153" text-anchor="middle" font-size="9.5" fill="#444444">(TOTP / Google Auth)</text>

  <path d="M 470 141 L 400 141" stroke="#000000" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow-open)"/>
  <text x="435" y="135" text-anchor="middle" font-size="9" fill="#000000">&lt;&lt;extend&gt;&gt;</text>

  <ellipse cx="780" cy="141" rx="80" ry="21" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="780" y="145" text-anchor="middle" font-size="10.5" fill="#000000">Quên / Đặt lại mật khẩu</text>

  <path d="M 700 141 L 640 141" stroke="#000000" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow-open)"/>
  <text x="670" y="135" text-anchor="middle" font-size="9" fill="#000000">&lt;&lt;extend&gt;&gt;</text>


