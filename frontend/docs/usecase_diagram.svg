  <text x="320" y="730" text-anchor="middle" font-size="10" font-weight="bold" fill="#000000">(IndexedDB / Dexie.js)</text>

  <path d="M 320 695 L 320 653" stroke="#000000" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow-open)"/>
  <text x="328" y="678" font-size="9" fill="#000000">&lt;&lt;extend&gt;&gt;</text>

  <ellipse cx="565" cy="720" rx="95" ry="25" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
  <text x="565" y="716" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">Đồng bộ &amp; Xử lý xung đột</text>
  <text x="565" y="730" text-anchor="middle" font-size="10" fill="#444444">(Sync Engine khi có mạng)</text>

  <path d="M 470 720 L 410 720" stroke="#000000" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow-open)"/>
  <text x="440" y="714" text-anchor="middle" font-size="9" fill="#000000">&lt;&lt;include&gt;&gt;</text>


