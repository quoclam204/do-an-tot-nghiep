    <text x="18" y="107" text-anchor="middle" font-size="10" fill="#444444">(ADMIN)</text>
  </g>

  <!-- 5. Secondary Actor: System -->
  <g id="actor_system" transform="translate(1250, 660)">
    <rect x="-10" y="0" width="56" height="24" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
    <text x="18" y="15" text-anchor="middle" font-size="9" font-weight="bold" fill="#000000">&amp;laquo;system&amp;raquo;</text>
    <circle cx="18" cy="40" r="11" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
    <line x1="18" y1="51" x2="18" y2="77" stroke="#000000" stroke-width="1.8"/>
    <line x1="0" y1="61" x2="36" y2="61" stroke="#000000" stroke-width="1.8"/>
    <line x1="18" y1="77" x2="5" y2="101" stroke="#000000" stroke-width="1.8"/>
