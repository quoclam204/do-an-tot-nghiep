<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1380 920" width="100%" height="100%" style="background:#ffffff; font-family:Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrow-open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#000000" stroke-width="1.3"/>
    </marker>
  </defs>

  <!-- ==================== SYSTEM BOUNDARY ==================== -->
  <rect x="190" y="25" width="990" height="865" rx="8" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="685" y="55" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">HỆ THỐNG QUẢN LÝ NÔNG NGHIỆP DALATAGRI</text>

  <!-- ==================== ACTORS ==================== -->
  <!-- 1. Guest -->
  <g id="actor_guest" transform="translate(45, 65)">
    <circle cx="18" cy="15" r="11" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
    <line x1="18" y1="26" x2="18" y2="52" stroke="#000000" stroke-width="1.8"/>
    <line x1="0" y1="36" x2="36" y2="36" stroke="#000000" stroke-width="1.8"/>
    <line x1="18" y1="52" x2="5" y2="76" stroke="#000000" stroke-width="1.8"/>
    <line x1="18" y1="52" x2="31" y2="76" stroke="#000000" stroke-width="1.8"/>
    <text x="18" y="94" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">Khách vãng lai</text>
    <text x="18" y="107" text-anchor="middle" font-size="10" fill="#444444">(Guest)</text>
  </g>

  <!-- 2. Owner -->
  <g id="actor_owner" transform="translate(45, 320)">
    <circle cx="18" cy="15" r="11" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
    <line x1="18" y1="26" x2="18" y2="52" stroke="#000000" stroke-width="1.8"/>
    <line x1="0" y1="36" x2="36" y2="36" stroke="#000000" stroke-width="1.8"/>
    <line x1="18" y1="52" x2="5" y2="76" stroke="#000000" stroke-width="1.8"/>
    <line x1="18" y1="52" x2="31" y2="76" stroke="#000000" stroke-width="1.8"/>
    <text x="18" y="94" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">Chủ nông hộ</text>
    <text x="18" y="107" text-anchor="middle" font-size="10" fill="#444444">(OWNER)</text>
  </g>

  <!-- 3. Worker -->
  <g id="actor_worker" transform="translate(45, 620)">
    <circle cx="18" cy="15" r="11" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
    <line x1="18" y1="26" x2="18" y2="52" stroke="#000000" stroke-width="1.8"/>
    <line x1="0" y1="36" x2="36" y2="36" stroke="#000000" stroke-width="1.8"/>
    <line x1="18" y1="52" x2="5" y2="76" stroke="#000000" stroke-width="1.8"/>
    <line x1="18" y1="52" x2="31" y2="76" stroke="#000000" stroke-width="1.8"/>
    <text x="18" y="94" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">Nhân công</text>
    <text x="18" y="107" text-anchor="middle" font-size="10" fill="#444444">(WORKER)</text>
  </g>

  <!-- 4. Admin -->
  <g id="actor_admin" transform="translate(1250, 320)">
    <circle cx="18" cy="15" r="11" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
    <line x1="18" y1="26" x2="18" y2="52" stroke="#000000" stroke-width="1.8"/>
    <line x1="0" y1="36" x2="36" y2="36" stroke="#000000" stroke-width="1.8"/>
    <line x1="18" y1="52" x2="5" y2="76" stroke="#000000" stroke-width="1.8"/>
