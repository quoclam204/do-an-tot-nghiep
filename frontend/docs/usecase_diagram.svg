  <!-- 1. Nông trại -->
  <ellipse cx="315" cy="211" rx="85" ry="21" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
  <text x="315" y="215" text-anchor="middle" font-size="11.5" fill="#000000">Quản lý Nông trại</text>

  <ellipse cx="555" cy="211" rx="85" ry="21" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
